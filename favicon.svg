<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="منصة خدمات الموظف والمقيم في السعودية">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b24" />
      <stop offset="1" stop-color="#1a8a56" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="1" stop-color="#f0b429" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)" />
  <!-- مقبض الحقيبة -->
  <rect x="37" y="24" width="26" height="22" rx="9" fill="none" stroke="#f0b429" stroke-width="8" />
  <!-- جسم الحقيبة -->
  <rect x="15" y="39" width="70" height="45" rx="10" fill="url(#body)" />
  <!-- خط الفتحة -->
  <rect x="15" y="56" width="70" height="4.5" fill="#0b3b24" opacity="0.32" />
</svg>
